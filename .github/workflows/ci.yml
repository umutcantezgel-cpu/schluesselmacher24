name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefen:
    name: Typprüfung, Lint, Tests, Build
    # Automatische Bot-Zweige (sentinel/*, jules-*) nicht prüfen – spart Actions-Minuten.
    if: ${{ !startsWith(github.head_ref, 'sentinel/') && !startsWith(github.head_ref, 'jules-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Kein Test darf echte Dienste erreichen; der Build läuft ohne Datenbank.
      SM24_DATA: json
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Eigene Postgres-Instanz aus embedded-postgres (der Runner ist kein root).
      - name: DB-Tests
        run: npm run test:db
        env:
          SM24_DATA: ''
      - name: Build ohne Datenbank
        run: npx next build
